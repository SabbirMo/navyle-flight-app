name: navyla_flight_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.1


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_riverpod: ^3.4.3
  flutter_screenutil: ^5.9.3
  go_router: ^18.0.1
  flutter_svg: ^2.3.0
  geolocator: ^14.0.3
  pin_code_fields: ^10.0.0
  lottie: ^3.6.1
  image_picker: ^1.2.3
  camera: ^0.12.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

 
  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/svgs/
    - assets/lottie/

 
  fonts:
    - family: SF-Pro
      fonts:
        - asset: assets/fonts/SFPRODISPLAYBOLD.OTF
          weight: 700
    
  
